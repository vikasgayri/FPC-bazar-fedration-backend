<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password · FPC Bazaar Federation</title>
  <link rel="stylesheet" href="/reset-password.css">
  <script src="/reset-password.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">FPC BAZAAR FEDERATION</p>
    <h1>Choose a new password</h1>
    <p>Use at least 10 characters, including letters and numbers.</p>
    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <button type="submit">Save new password</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="help">Link expired? Request another password reset from your sign-in page, or contact your administrator.</p>
  </main>
</body>
</html>
